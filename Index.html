<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DashHub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1120;color:white;padding:20px}
.container{max-width:800px;margin:30px auto}
.box{background:#172338;padding:24px;border-radius:16px;margin-bottom:20px}
h1{color:#60a5fa}
input{width:100%;padding:12px;margin:8px 0 15px;background:#0b1120;color:white;border:1px solid #34445e;border-radius:8px}
button{padding:11px 16px;background:#3b82f6;color:white;border:0;border-radius:8px;cursor:pointer;margin:4px}
button:hover{background:#2563eb}
.link{background:#0b172a;padding:16px;border-radius:10px;margin:12px 0;overflow-wrap:anywhere}
.delete{background:#dc2626}
.hidden{display:none}
a{color:#60a5fa}
#message{color:#fca5a5}
</style>
</head>
<body>
<div class="container">

<div class="box" id="login">
<h1>⚡ DashHub</h1>
<h2>Login</h2>
<form id="loginForm">
<input id="password" type="password" placeholder="Enter password" required>
<button type="submit">Login</button>
</form>
<p id="message"></p>
</div>

<div id="dashboard" class="hidden">
<div class="box">
<h1>My Dashboard</h1>
<p id="role"></p>
<button onclick="logout()">Logout</button>
</div>

<div class="box hidden" id="admin">
<h2>👑 Admin Panel</h2>
<form id="addForm">
<input id="name" placeholder="Website name" required>
<input id="url" type="url" placeholder="https://example.com" required>
<button type="submit">Add Link</button>
</form>
</div>

<div class="box">
<h2>🔗 Websites</h2>
<div id="links"></div>
</div>
</div>
</div>

<script>
const USER_PASSWORD = "hi999";
const ADMIN_PASSWORD = "no888";

let currentRole = "";
let links = [];

try {
  links = JSON.parse(localStorage.getItem("dashhubLinks") || "[]");
  if (!Array.isArray(links)) links = [];
} catch {
  links = [];
}

document.getElementById("loginForm").onsubmit = function(e) {
  e.preventDefault();

  const password = document.getElementById("password").value;

  if (password === ADMIN_PASSWORD) {
    currentRole = "admin";
  } else if (password === USER_PASSWORD) {
    currentRole = "user";
  } else {
    document.getElementById("message").textContent =
      "Incorrect password!";
    return;
  }

  document.getElementById("message").textContent = "";
  document.getElementById("login").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  document.getElementById("admin").classList.toggle(
    "hidden", currentRole !== "admin"
  );

  document.getElementById("role").textContent =
    currentRole === "admin"
      ? "👑 Logged in as Admin"
      : "👤 Logged in as User";

  renderLinks();
};

document.getElementById("addForm").onsubmit = function(e) {
  e.preventDefault();
  if (currentRole !== "admin") return;

  const name = document.getElementById("name").value.trim();
  let url;

  try {
    url = new URL(document.getElementById("url").value.trim());
    if (!["http:", "https:"].includes(url.protocol)) {
      alert("Use an HTTP or HTTPS website URL.");
      return;
    }
  } catch {
    alert("Enter a valid website URL.");
    return;
  }

  if (!name) return;

  links.push({name: name, url: url.href});
  saveLinks();
  this.reset();
  renderLinks();
};

function saveLinks() {
  localStorage.setItem("dashhubLinks", JSON.stringify(links));
}

function renderLinks() {
  const container = document.getElementById("links");
  container.replaceChildren();

  if (links.length === 0) {
    container.textContent = "No links added yet.";
    return;
  }

  links.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "link";

    const title = document.createElement("h3");
    title.textContent = item.name;

    const anchor = document.createElement("a");
    anchor.textContent = "Open Website ↗";
    anchor.href = item.url;
    anchor.target = "_blank";
    anchor.rel = "noopener noreferrer";

    card.append(title, anchor);

    if (currentRole === "admin") {
      const del = document.createElement("button");
      del.className = "delete";
      del.textContent = "Delete Link";

      del.onclick = function() {
        if (currentRole !== "admin") return;
        if (confirm("Delete this link?")) {
          links.splice(index, 1);
          saveLinks();
          renderLinks();
        }
      };

      card.appendChild(del);
    }

    container.appendChild(card);
  });
}

function logout() {
  currentRole = "";
  document.getElementById("password").value = "";
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
}
</script>
</body>
</html>
